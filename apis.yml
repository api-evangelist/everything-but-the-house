aid: everything-but-the-house
name: Everything But The House
description: 'Everything But The House (EBTH) is a Blue Ash, Ohio online estate sale
  and consignment auction marketplace founded in 2008 by Jacquie Denny and Brian Graves.
  It runs curated, full-service online estate sales — cataloging, photography, appraisal,
  payment and shipping — for homeowners, estate managers, dealers and collectors, and
  sells the resulting antiques, fine art, jewelry, coins, watches, furniture and collectibles
  to buyers through timed online auctions where most lots open at one dollar. EBTH sells
  a consumer marketplace and a consignment service, not a developer platform: the company
  publishes no developer portal, API reference, machine-readable specification, SDK or
  webhook catalog. Its public GitHub organization contains only forks of third-party
  Ruby gems, its mobile apps are webview wrappers around ebth.com, and the only GraphQL
  endpoint on the site is an internal one that robots.txt disallows. The single machine-facing
  surface it does operate is a public Uptime Kuma status page at status.ebth.com.'
