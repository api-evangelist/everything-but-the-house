    platform — /developers, /api, /docs, /openapi.json, /swagger.json, /api-docs and
    /llms.txt all return a real 404 on www.ebth.com, api.ebth.com answers every path with
    an Envoy 404 ("fault filter abort"), developer/developers/docs/mcp.ebth.com do not
    resolve in DNS, github.com/ebth holds only nine forks of third-party Ruby gems (newest
    touched 2021), the mobile apps are webview wrappers around ebth.com, and the site's
    one /graphql endpoint is an internal front-end endpoint that robots.txt disallows.
